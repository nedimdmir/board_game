<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="auto">
  <defs>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="starTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="trapTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="shopTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="mysteryTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .t-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #FFFFFF; }
    .t-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: rgba(255,255,255,0.7); }
    .hud-title { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: #FFFFFF; }
    .hud-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #94A3B8; }
  </style>

  <!-- Canvas -->
  <rect width="1000" height="480" rx="20" fill="url(#boardBg)" />

  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4" />
  </pattern>
  <rect width="1000" height="480" rx="20" fill="url(#grid)" />

  <!-- HUD Top Bar -->
  <g transform="translate(40, 25)">
    <rect width="920" height="60" rx="14" fill="#0B132B" stroke="#334155" stroke-width="1.5" />
    <!-- Round Indicator -->
    <text x="30" y="36" class="hud-title">TUR 3 / 10</text>
    <text x="140" y="36" class="hud-sub">| Raund: 1</text>
    <!-- Player 1 Score -->
    <g transform="translate(320, 14)">
      <circle cx="16" cy="16" r="16" fill="#3B82F6" />
      <text x="16" y="21" font-size="14" text-anchor="middle" fill="#FFF">🧑</text>
      <text x="42" y="22" class="hud-title" font-size="15">Nedim</text>
      <text x="110" y="22" fill="#FBBF24" font-weight="800" font-size="15">⭐ 2</text>
      <text x="160" y="22" fill="#FDE047" font-weight="700" font-size="15">🪙 38</text>
    </g>
    <!-- Player 2 Score (Bot) -->
    <g transform="translate(560, 14)">
      <circle cx="16" cy="16" r="16" fill="#10B981" />
      <text x="16" y="21" font-size="14" text-anchor="middle" fill="#FFF">🤖</text>
      <text x="42" y="22" class="hud-title" font-size="15">Bot Ali</text>
      <text x="120" y="22" fill="#FBBF24" font-weight="800" font-size="15">⭐ 1</text>
      <text x="170" y="22" fill="#FDE047" font-weight="700" font-size="15">🪙 24</text>
    </g>
    <!-- Leave Room Pill -->
    <g transform="translate(790, 13)">
      <rect width="110" height="34" rx="8" fill="#DC2626" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
      <text x="55" y="22" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">🚪 Ayrıl</text>
    </g>
  </g>

  <!-- Interactive 32-Tile Path Preview Showcase -->
  <g transform="translate(60, 110)">
    <!-- Path Line -->
    <path d="M 50 250 C 150 290, 320 280, 440 240 C 560 200, 700 210, 840 250" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" />

    <!-- Tile 0: Start (Kordon) -->
    <g transform="translate(20, 210)" filter="url(#tileShadow)">
      <rect width="70" height="60" rx="12" fill="#10B981" stroke="#059669" stroke-width="2" />
      <text x="35" y="26" class="t-num" text-anchor="middle">#0</text>
      <text x="35" y="44" class="t-label" text-anchor="middle">🏁 BAŞLA</text>
      <!-- Player Pawn -->
      <circle cx="35" cy="5" r="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3" />
      <text x="35" y="10" font-size="12" text-anchor="middle" fill="#FFF">👑</text>
    </g>

    <!-- Tile 1: Coin Tile -->
    <g transform="translate(130, 230)" filter="url(#tileShadow)">
      <rect width="70" height="60" rx="12" fill="url(#goldTile)" stroke="#B45309" stroke-width="2" />
      <text x="35" y="26" class="t-num" text-anchor="middle">#1</text>
      <text x="35" y="44" class="t-label" text-anchor="middle">+4 🪙</text>
    </g>

    <!-- Tile 2: Mystery Wheel -->
    <g transform="translate(240, 240)" filter="url(#tileShadow)">
      <rect width="70" height="60" rx="12" fill="url(#mysteryTile)" stroke="#6B21A8" stroke-width="2" />
      <text x="35" y="26" class="t-num" text-anchor="middle">#2</text>
      <text x="35" y="44" class="t-label" text-anchor="middle">🎡 ÇARK</text>
    </g>

    <!-- Tile 3: Shop -->
    <g transform="translate(350, 220)" filter="url(#tileShadow)">
      <rect width="70" height="60" rx="12" fill="url(#shopTile)" stroke="#1D4ED8" stroke-width="2" />
      <text x="35" y="26" class="t-num" text-anchor="middle">#3</text>
      <text x="35" y="44" class="t-label" text-anchor="middle">🛍️ DÜKKAN</text>
    </g>

    <!-- Tile 4: Star Kaide -->
    <g transform="translate(460, 180)" filter="url(#tileShadow)">
      <rect width="80" height="66" rx="14" fill="url(#starTile)" stroke="#FEF08A" stroke-width="2.5" />
      <text x="40" y="26" class="t-num" text-anchor="middle">#4</text>
      <text x="40" y="48" class="t-label" text-anchor="middle">⭐ KAİDE</text>
      <!-- Floating Star Token -->
      <polygon points="40,2 44,10 53,11 46,18 48,27 40,22 32,27 34,18 27,11 36,10" fill="#FDE047" stroke="#B45309" stroke-width="1" />
    </g>

    <!-- Tile 5: Trap / Hazard -->
    <g transform="translate(580, 175)" filter="url(#tileShadow)">
      <rect width="70" height="60" rx="12" fill="url(#trapTile)" stroke="#991B1B" stroke-width="2" />
      <text x="35" y="26" class="t-num" text-anchor="middle">#5</text>
      <text x="35" y="44" class="t-label" text-anchor="middle">🔥 TUZAK</text>
    </g>

    <!-- Tile 6: Duel Arena -->
    <g transform="translate(690, 195)" filter="url(#tileShadow)">
      <rect width="70" height="60" rx="12" fill="#EC4899" stroke="#BE185D" stroke-width="2" />
      <text x="35" y="26" class="t-num" text-anchor="middle">#6</text>
      <text x="35" y="44" class="t-label" text-anchor="middle">⚔️ DÜELLO</text>
      <!-- Bot Pawn -->
      <circle cx="35" cy="5" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
      <text x="35" y="10" font-size="12" text-anchor="middle" fill="#FFF">🤖</text>
    </g>

    <!-- Tile 7: Next Star -->
    <g transform="translate(800, 225)" filter="url(#tileShadow)">
      <rect width="70" height="60" rx="12" fill="url(#goldTile)" stroke="#B45309" stroke-width="2" />
      <text x="35" y="26" class="t-num" text-anchor="middle">#7</text>
      <text x="35" y="44" class="t-label" text-anchor="middle">+6 🪙</text>
    </g>
  </g>

  <!-- Bottom Floating Action Bar Preview -->
  <g transform="translate(340, 395)" filter="url(#tileShadow)">
    <rect width="320" height="65" rx="32" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <!-- Roll Dice Button -->
    <rect x="15" y="10" width="160" height="45" rx="22" fill="#3B82F6" />
    <text x="95" y="38" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">🎲 ZAR AT (Space)</text>
    <!-- Inventory Button -->
    <rect x="185" y="10" width="120" height="45" rx="22" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <text x="245" y="38" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="middle">🎒 Çanta (I)</text>
  </g>
</svg>
