<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 490" width="100%" height="auto">
  <defs>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="goldTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="starTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="trapTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="shopTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="mysteryTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .t-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #FFFFFF; }
    .t-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: rgba(255,255,255,0.75); }
    .hud-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 800; fill: #FFFFFF; }
    .hud-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #94A3B8; }
  </style>

  <!-- Canvas Background -->
  <rect width="1060" height="490" rx="20" fill="url(#boardBg)" />

  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.45" />
  </pattern>
  <rect width="1060" height="490" rx="20" fill="url(#grid)" />

  <!-- 3D Island Diorama Preview Silhouette in Center -->
  <ellipse cx="530" cy="280" rx="440" ry="170" fill="#14532D" opacity="0.35" />
  <ellipse cx="530" cy="275" rx="410" ry="155" fill="#166534" opacity="0.4" />

  <!-- HUD Top Bar (Floating Glass Capsules) -->
  <g transform="translate(30, 20)">
    <rect width="1000" height="54" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <!-- Round Pill -->
    <rect x="20" y="11" width="130" height="32" rx="12" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.5)" />
    <text x="85" y="32" font-size="12" font-weight="800" fill="#FBBF24" text-anchor="middle">🏆 TUR 3 / 10</text>

    <!-- Player 1 Score Capsule -->
    <g transform="translate(260, 9)">
      <rect width="190" height="36" rx="18" fill="rgba(30, 41, 59, 0.9)" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="20" cy="18" r="14" fill="#3B82F6" />
      <text x="20" y="23" font-size="13" text-anchor="middle" fill="#FFF">👑</text>
      <text x="44" y="23" class="hud-title">Nedim</text>
      <text x="115" y="23" fill="#FBBF24" font-weight="800" font-size="13">⭐ 2</text>
      <text x="155" y="23" fill="#FDE047" font-weight="700" font-size="13">🪙 38</text>
    </g>

    <!-- Player 2 Score Capsule (Bot) -->
    <g transform="translate(480, 9)">
      <rect width="180" height="36" rx="18" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <circle cx="20" cy="18" r="14" fill="#10B981" />
      <text x="20" y="23" font-size="13" text-anchor="middle" fill="#FFF">🤖</text>
      <text x="44" y="23" class="hud-title">Bot Ali</text>
      <text x="110" y="23" fill="#FBBF24" font-weight="800" font-size="13">⭐ 1</text>
      <text x="145" y="23" fill="#FDE047" font-weight="700" font-size="13">🪙 24</text>
    </g>

    <!-- Leave Button Pill -->
    <g transform="translate(860, 10)">
      <rect width="120" height="34" rx="10" fill="rgba(220, 38, 38, 0.2)" stroke="#EF4444" stroke-width="1.2" />
      <text x="60" y="22" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">🚪 Ayrıl</text>
    </g>
  </g>

  <!-- Interactive 32-Tile Path Preview Showcase -->
  <g transform="translate(45, 115)">
    <!-- Path Line -->
    <path d="M 45 240 C 160 280, 340 270, 480 230 C 620 190, 780 200, 930 240" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />

    <!-- Tile 0: Start (Kordon) -->
    <g transform="translate(10, 205)" filter="url(#tileShadow)">
      <rect width="84" height="64" rx="14" fill="#10B981" stroke="#34D399" stroke-width="2" />
      <text x="42" y="24" class="t-num" text-anchor="middle">#0</text>
      <text x="42" y="47" class="t-label" text-anchor="middle">🏁 BAŞLA</text>
      <!-- Player Pawn -->
      <circle cx="42" cy="-2" r="15" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2.5" />
      <text x="42" y="3" font-size="13" text-anchor="middle" fill="#FFF">👑</text>
    </g>

    <!-- Tile 1: Coin Tile -->
    <g transform="translate(140, 225)" filter="url(#tileShadow)">
      <rect width="84" height="64" rx="14" fill="url(#goldTile)" stroke="#FDE047" stroke-width="2" />
      <text x="42" y="24" class="t-num" text-anchor="middle">#1</text>
      <text x="42" y="47" class="t-label" text-anchor="middle">+4 🪙</text>
    </g>

    <!-- Tile 2: Mystery Wheel -->
    <g transform="translate(270, 235)" filter="url(#tileShadow)">
      <rect width="84" height="64" rx="14" fill="url(#mysteryTile)" stroke="#D8B4FE" stroke-width="2" />
      <text x="42" y="24" class="t-num" text-anchor="middle">#2</text>
      <text x="42" y="47" class="t-label" text-anchor="middle">🎡 ÇARK</text>
    </g>

    <!-- Tile 3: Shop -->
    <g transform="translate(400, 215)" filter="url(#tileShadow)">
      <rect width="84" height="64" rx="14" fill="url(#shopTile)" stroke="#7DD3FC" stroke-width="2" />
      <text x="42" y="24" class="t-num" text-anchor="middle">#3</text>
      <text x="42" y="47" class="t-label" text-anchor="middle">🛍️ DÜKKAN</text>
    </g>

    <!-- Tile 4: Star Kaide -->
    <g transform="translate(530, 175)" filter="url(#tileShadow)">
      <rect width="92" height="70" rx="16" fill="url(#starTile)" stroke="#FEF08A" stroke-width="3" />
      <text x="46" y="26" class="t-num" text-anchor="middle">#4</text>
      <text x="46" y="52" class="t-label" text-anchor="middle">⭐ KAİDE</text>
      <!-- Floating Star Token -->
      <polygon points="46,2 50,11 60,12 52,19 55,29 46,23 37,29 40,19 32,12 42,11" fill="#FDE047" stroke="#B45309" stroke-width="1.2" />
    </g>

    <!-- Tile 5: Trap / Hazard -->
    <g transform="translate(665, 175)" filter="url(#tileShadow)">
      <rect width="84" height="64" rx="14" fill="url(#trapTile)" stroke="#FCA5A5" stroke-width="2" />
      <text x="42" y="24" class="t-num" text-anchor="middle">#5</text>
      <text x="42" y="47" class="t-label" text-anchor="middle">🔥 TUZAK</text>
    </g>

    <!-- Tile 6: Duel Arena -->
    <g transform="translate(795, 195)" filter="url(#tileShadow)">
      <rect width="84" height="64" rx="14" fill="#EC4899" stroke="#F9A8D4" stroke-width="2" />
      <text x="42" y="24" class="t-num" text-anchor="middle">#6</text>
      <text x="42" y="47" class="t-label" text-anchor="middle">⚔️ DÜELLO</text>
      <!-- Bot Pawn -->
      <circle cx="42" cy="-2" r="15" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
      <text x="42" y="3" font-size="13" text-anchor="middle" fill="#FFF">🤖</text>
    </g>

    <!-- Tile 7: Next Star -->
    <g transform="translate(920, 225)" filter="url(#tileShadow)">
      <rect width="84" height="64" rx="14" fill="url(#goldTile)" stroke="#FDE047" stroke-width="2" />
      <text x="42" y="24" class="t-num" text-anchor="middle">#7</text>
      <text x="42" y="47" class="t-label" text-anchor="middle">+6 🪙</text>
    </g>
  </g>

  <!-- Bottom Floating Action Bar Preview (Spacious, Zero Overflows) -->
  <g transform="translate(300, 410)" filter="url(#tileShadow)">
    <rect width="460" height="62" rx="31" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.8" />
    <!-- Roll Dice Button -->
    <rect x="14" y="9" width="180" height="44" rx="22" fill="#DC2626" stroke="#EF4444" stroke-width="1.5" />
    <text x="104" y="36" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">🎲 ZAR AT! (SPACE)</text>
    <!-- Inventory Button -->
    <rect x="206" y="9" width="130" height="44" rx="22" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <text x="271" y="36" font-size="13" font-weight="800" fill="#E2E8F0" text-anchor="middle">🎒 Çantam (2)</text>
    <!-- Speed Turbo Button -->
    <rect x="348" y="9" width="98" height="44" rx="22" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
    <text x="397" y="36" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">⚡ 2x Hız</text>
  </g>
</svg>