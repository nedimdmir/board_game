<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 4px; fill: #38BDF8; text-transform: uppercase; }
    .title-main { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 54px; font-weight: 900; fill: #FFFFFF; }
    .title-accent { fill: url(#goldGrad); }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; fill: #94A3B8; font-weight: 500; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Board Circuit Path (Background Graphic) -->
  <path d="M 50 350 C 300 380, 500 280, 700 320 C 900 360, 1100 240, 1150 120" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="12 12" opacity="0.4" />
  
  <!-- Floating Ambient Particles -->
  <circle cx="150" cy="80" r="3" fill="#FDE047" opacity="0.8" />
  <circle cx="280" cy="50" r="2" fill="#38BDF8" opacity="0.6" />
  <circle cx="420" cy="110" r="4" fill="#E879F9" opacity="0.7" />
  <circle cx="850" cy="60" r="3" fill="#34D399" opacity="0.8" />
  <circle cx="1080" cy="180" r="2" fill="#FDE047" opacity="0.6" />

  <!-- Left Column: Branding & Features -->
  <g transform="translate(80, 85)">
    <!-- Subtitle Badge -->
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#0369A1" fill-opacity="0.3" stroke="#0284C7" stroke-width="1.5" />
    <text x="130" y="21" class="title-sub" text-anchor="middle">BOARD &amp; PARTY GAME</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-main" filter="url(#dropShadow)">PARTYCRAFT</text>
    <text x="0" y="132" class="title-main"><tspan class="title-accent">WONDER BOARD</tspan></text>

    <!-- Description -->
    <text x="0" y="175" class="desc">Sıra tabanlı çok oyunculu dünya şehirleri masa oyunu.</text>
    <text x="0" y="202" class="desc">Turn-based multiplayer board game with 6 mini-games.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 235)">
      <!-- Pill 1: Languages -->
      <g transform="translate(0, 0)">
        <rect width="175" height="40" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
        <text x="87" y="25" class="pill-text" text-anchor="middle">🌐 5 Languages</text>
      </g>
      <!-- Pill 2: Single-File -->
      <g transform="translate(188, 0)">
        <rect width="205" height="40" rx="20" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
        <text x="102" y="25" class="pill-text" text-anchor="middle">⚡ Single-File Ready</text>
      </g>
      <!-- Pill 3: Minigames -->
      <g transform="translate(405, 0)">
        <rect width="185" height="40" rx="20" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
        <text x="92" y="25" class="pill-text" text-anchor="middle">🎮 6 Mini-Games</text>
      </g>
    </g>
  </g>

  <!-- Right Column: 3D Isometric Dice & Board Visual Showcase -->
  <g transform="translate(820, 190)" filter="url(#dropShadow)">
    <!-- Golden Star Kaide Base -->
    <ellipse cx="140" cy="150" rx="160" ry="40" fill="#000000" fill-opacity="0.4" />
    <ellipse cx="140" cy="140" rx="130" ry="30" fill="url(#goldGrad)" opacity="0.3" filter="url(#glow)" />

    <!-- 3D Red Dice -->
    <g transform="translate(40, -40)">
      <!-- Top Face -->
      <polygon points="60,0 120,30 60,60 0,30" fill="#EF4444" stroke="#DC2626" stroke-width="2" />
      <circle cx="60" cy="30" r="7" fill="#FFFFFF" />
      <!-- Left Face -->
      <polygon points="0,30 60,60 60,130 0,100" fill="#B91C1C" stroke="#991B1B" stroke-width="2" />
      <circle cx="20" cy="55" r="5" fill="#FFFFFF" />
      <circle cx="40" cy="85" r="5" fill="#FFFFFF" />
      <!-- Right Face -->
      <polygon points="60,60 120,30 120,100 60,130" fill="#DC2626" stroke="#B91C1C" stroke-width="2" />
      <circle cx="80" cy="70" r="5" fill="#FFFFFF" />
      <circle cx="100" cy="50" r="5" fill="#FFFFFF" />
      <circle cx="80" cy="110" r="5" fill="#FFFFFF" />
      <circle cx="100" cy="90" r="5" fill="#FFFFFF" />
    </g>

    <!-- 3D Blue Dice -->
    <g transform="translate(140, 20)">
      <!-- Top Face -->
      <polygon points="50,0 100,25 50,50 0,25" fill="#38BDF8" stroke="#0284C7" stroke-width="2" />
      <circle cx="30" cy="20" r="5" fill="#FFFFFF" />
      <circle cx="70" cy="30" r="5" fill="#FFFFFF" />
      <!-- Left Face -->
      <polygon points="0,25 50,50 50,110 0,85" fill="#0284C7" stroke="#0369A1" stroke-width="2" />
      <circle cx="15" cy="45" r="4.5" fill="#FFFFFF" />
      <circle cx="25" cy="67" r="4.5" fill="#FFFFFF" />
      <circle cx="35" cy="90" r="4.5" fill="#FFFFFF" />
      <!-- Right Face -->
      <polygon points="50,50 100,25 100,85 50,110" fill="#0369A1" stroke="#075985" stroke-width="2" />
      <circle cx="65" cy="65" r="5" fill="#FFFFFF" />
      <circle cx="85" cy="80" r="5" fill="#FFFFFF" />
    </g>

    <!-- Floating Gold Star -->
    <g transform="translate(180, -90) scale(1.4)" filter="url(#glow)">
      <polygon points="25,0 32,15 49,18 37,30 40,47 25,39 9,47 13,30 1,18 17,15" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="1.5" />
    </g>
  </g>
</svg>
