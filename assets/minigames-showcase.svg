<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="100%" height="auto">
  <defs>
    <linearGradient id="mgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #FFFFFF; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #94A3B8; }
    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 900; fill: #FFFFFF; letter-spacing: 0.5px; }
  </style>

  <!-- Canvas -->
  <rect width="1060" height="380" rx="20" fill="url(#mgBg)" />

  <!-- Section Title -->
  <text x="530" y="44" class="header-title" text-anchor="middle">🎮 6 HEYECAN VERİCİ ÇOK OYUNCULU MİNİ OYUN</text>

  <!-- 6 Minigame Cards in 2 rows of 3 -->
  <g transform="translate(45, 75)">
    <!-- 1. Coin Catcher -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="305" height="120" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <text x="20" y="42" font-size="28">🪙</text>
      <text x="65" y="34" class="card-title">1. Altın Toplama Sepeti</text>
      <text x="65" y="52" font-size="11" fill="#38BDF8" font-weight="700">Coin Catcher</text>
      <text x="20" y="80" class="card-sub">Gökten düşen altınları sepetle yakala</text>
      <text x="20" y="98" class="card-sub">(dokunmatik mobil zoom korumalı).</text>
    </g>

    <!-- 2. Reflex Pop -->
    <g transform="translate(332, 0)" filter="url(#cardShadow)">
      <rect width="305" height="120" rx="16" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
      <text x="20" y="42" font-size="28">🎯</text>
      <text x="65" y="34" class="card-title">2. Refleks Hedefleri</text>
      <text x="65" y="52" font-size="11" fill="#F472B6" font-weight="700">Reflex Pop</text>
      <text x="20" y="80" class="card-sub">Aniden beliren hedeflere ıskalamadan</text>
      <text x="20" y="98" class="card-sub">hızlıca dokunup puanları topla.</text>
    </g>

    <!-- 3. Balloon Mash -->
    <g transform="translate(664, 0)" filter="url(#cardShadow)">
      <rect width="305" height="120" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <text x="20" y="42" font-size="28">🎈</text>
      <text x="65" y="34" class="card-title">3. Balon Patlatma</text>
      <text x="65" y="52" font-size="11" fill="#FBBF24" font-weight="700">Balloon Mash</text>
      <text x="20" y="80" class="card-sub">10 saniyede ekrandaki balona</text>
      <text x="20" y="98" class="card-sub">en çok tıklayarak şişir ve patlat!</text>
    </g>

    <!-- Row 2 -->
    <!-- 4. Lucky Chests -->
    <g transform="translate(0, 142)" filter="url(#cardShadow)">
      <rect width="305" height="120" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" />
      <text x="20" y="42" font-size="28">🎁</text>
      <text x="65" y="34" class="card-title">4. Şans Sandıkları</text>
      <text x="65" y="52" font-size="11" fill="#A78BFA" font-weight="700">Lucky Chests</text>
      <text x="20" y="80" class="card-sub">3 sandıktan doğru olanı seç,</text>
      <text x="20" y="98" class="card-sub">büyük altın hazinesini ortaya çıkar.</text>
    </g>

    <!-- 5. Memory Matrix -->
    <g transform="translate(332, 142)" filter="url(#cardShadow)">
      <rect width="305" height="120" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <text x="20" y="42" font-size="28">🧠</text>
      <text x="65" y="34" class="card-title">5. Hafıza Matrisi</text>
      <text x="65" y="52" font-size="11" fill="#34D399" font-weight="700">Memory Matrix</text>
      <text x="20" y="80" class="card-sub">Yanıp sönen renkli karo dizilimini</text>
      <text x="20" y="98" class="card-sub">aklında tut ve hatasız tekrarla.</text>
    </g>

    <!-- 6. Timing Hammer (YENİ!) -->
    <g transform="translate(664, 142)" filter="url(#cardShadow)">
      <rect width="305" height="120" rx="16" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
      <text x="20" y="42" font-size="28">🔨</text>
      <text x="65" y="34" class="card-title">6. Güç Çekici</text>
      <text x="65" y="52" font-size="11" fill="#F87171" font-weight="700">Timing Hammer</text>
      <text x="20" y="80" class="card-sub">Salınan ibreyi Bullseye'da durdur,</text>
      <text x="20" y="98" class="card-sub">çanı çaldır ve +15 Altın ödül kazan!</text>
    </g>
  </g>
</svg>